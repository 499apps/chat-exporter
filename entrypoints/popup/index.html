<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Convo Keeper</title>
    <meta name="manifest.default_title" content="__MSG_actionTitle__" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <img src="/icon/32.png" alt="" width="24" height="24" />
      <h1 data-i18n="extName">Convo Keeper</h1>
      <button id="settings" class="icon-btn" type="button" data-i18n-aria-label="settings" data-i18n-title="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.4 7.4 0 0 0-1.68-.98l-.36-2.54A.5.5 0 0 0 14.14 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.16.57-1.68.98l-2.39-.96a.5.5 0 0 0-.6.22L2.86 8.52a.5.5 0 0 0 .12.64l2.03 1.58a7.8 7.8 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.52.41 1.08.74 1.68.98l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.6-.24 1.16-.57 1.68-.98l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64z"/></svg>
      </button>
    </header>

    <section id="site" class="card site" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div class="site-text">
        <strong id="site-title">…</strong>
        <span id="site-sub"></span>
      </div>
    </section>

    <section id="empty" class="card empty" hidden>
      <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><rect x="6" y="9" width="36" height="24" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 33v7l8-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 21h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <h2 data-i18n="unsupportedTitle">Nothing to export here</h2>
      <p data-i18n="unsupportedBody"></p>
      <ul class="sites"><li>ChatGPT</li><li>Claude</li><li>Gemini</li><li>Grok</li></ul>
    </section>

    <div id="main">
      <div class="grid" role="group" aria-label="Export formats">
        <button class="act primary" data-format="markdown" data-key="m"><span class="k" aria-hidden="true">M</span><b data-i18n="fmtMarkdown">Markdown</b><small data-i18n="hintMarkdown"></small></button>
        <button class="act" data-format="pdf" data-key="p"><span class="k" aria-hidden="true">P</span><b data-i18n="fmtPdf">PDF</b><small data-i18n="hintPdf"></small></button>
        <button class="act" data-format="html" data-key="h"><span class="k" aria-hidden="true">H</span><b data-i18n="fmtHtml">HTML</b><small data-i18n="hintHtml"></small></button>
        <button class="act" data-format="copy" data-key="c"><span class="k" aria-hidden="true">C</span><b data-i18n="fmtCopy">Copy</b><small data-i18n="hintCopy"></small></button>
        <button class="act" data-format="json" data-key="j"><span class="k" aria-hidden="true">J</span><b data-i18n="fmtJson">JSON</b><small data-i18n="hintJson"></small></button>
        <button class="act" data-format="txt" data-key="t"><span class="k" aria-hidden="true">T</span><b data-i18n="fmtText">Text</b><small data-i18n="hintText"></small></button>
      </div>

      <details id="picker" class="card picker">
        <summary><span data-i18n="chooseMessages">Choose messages</span> <span id="sel-count" class="muted"></span></summary>
        <div class="picker-tools">
          <button type="button" id="sel-all" class="link" data-i18n="selectAll">All</button>
          <button type="button" id="sel-none" class="link" data-i18n="selectNone">None</button>
        </div>
        <ul id="msg-list" class="msg-list"></ul>
      </details>
    </div>

    <div id="busy" class="busy" hidden role="status">
      <span class="spinner" aria-hidden="true"></span>
      <div><strong data-i18n="reading">Reading…</strong><small data-i18n="readingHint"></small></div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <footer class="foot">
      <span class="lock" aria-hidden="true">🔒</span> <span data-i18n="privacyNote">Runs only on your device</span> ·
      <a href="/privacy.html" target="_blank" data-i18n="privacy">Privacy</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
